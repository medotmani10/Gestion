version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion -d gestion"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
